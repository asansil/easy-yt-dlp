name: E2E weekly

on:
  schedule:
    # Mondays 06:00 UTC: catch site or yt-dlp changes that break real downloads.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Real downloads with the latest yt-dlp, FFmpeg and deno
        run: uv run pytest -m e2e -v tests/e2e
