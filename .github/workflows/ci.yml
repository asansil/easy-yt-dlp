name: CI

on:
  push:
    branches: [main, v2]
  pull_request:
    branches: [main, v2]

permissions:
  contents: read

jobs:
  # The job id "test" is a required status check in the branch rulesets; do not rename it.
  test:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run tests
        run: uv run pytest
