[project]
name = "easy-ytdlp"
version = "2.0.0b2"
description = "A Windows desktop app that makes yt-dlp comfortable to use."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Andrés Sánchez" }]
requires-python = ">=3.12,<3.13"
dependencies = ["pyside6"]

[project.urls]
Repository = "https://github.com/asansil/easy-yt-dlp"

[dependency-groups]
dev = ["ruff", "pytest", "pytest-qt", "pyinstaller"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/easy_ytdlp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Real downloads run only on demand (pytest -m e2e) and in e2e-weekly.yml.
addopts = "-m 'not e2e'"
markers = ["e2e: real downloads over the network"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
